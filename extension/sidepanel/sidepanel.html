<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceLink AI</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="app">

    <header>
      <span id="status" class="status idle">Idle</span>
      <div class="mode-toggle" role="tablist">
        <button id="modeGemini" class="mode active" data-mode="gemini">Gemini</button>
        <button id="modeHelp" class="mode" data-mode="help">Help</button>
      </div>
      <button id="micToggle">⏺ Start</button>
      <button id="hushBtn" title="Stop reading the current reply">🔇 Hush</button>
    </header>

    <details id="settings">
      <summary>Settings</summary>
      <div class="settings-grid">
        <label>
          <span>Voice</span>
          <select id="voiceSelect"></select>
        </label>
        <label>
          <span>Rate <span id="rateValue">1.05</span>×</span>
          <input id="rateSlider" type="range" min="0.5" max="2" step="0.05" value="1.05" />
        </label>
      </div>
    </details>

    <section id="transcript">
      <div id="messages"></div>
      <div id="interim"></div>
    </section>

    <section id="tasks-section">
      <div class="section-header">
        <span>Tasks</span>
        <button id="clearDone">Clear done</button>
      </div>
      <ul id="taskList"></ul>
      <div class="add-row">
        <input id="taskInput" type="text" placeholder="Add task…" />
        <button id="addTaskBtn">+</button>
      </div>
    </section>

  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
